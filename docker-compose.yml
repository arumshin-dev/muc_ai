version: '3.8'

services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15
    container_name: muc_ai_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]

      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend (FastAPI)
  backend:
    build: ./backend
    container_name: muc_ai_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_GPT4_API_KEY: ${OPENAI_GPT4_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      HUGGINGFACE_DEFAULT_MODEL: ${HUGGINGFACE_DEFAULT_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER}
      AI_PROVIDER_FALLBACK_ORDER: ${AI_PROVIDER_FALLBACK_ORDER}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: ${ENVIRONMENT}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 3. Frontend (Next.js) - 기존 앱
  frontend:
    build: ./frontend
    container_name: muc_ai_frontend
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}  # API 서버의 URL
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # 4. Static Frontend (HTML/CSS/JS) - 새로운 앱
  static-frontend:
    image: nginx:alpine
    container_name: muc_ai_static_frontend
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./static_frontend:/usr/share/nginx/html

  # 5. Jupyter Notebook (개발/실험용) (jupyter 서비스는 기존과 동일)
  jupyter:
    image: jupyter/base-notebook
    container_name: muc_ai_jupyter
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./jupyter:/home/jovyan/work
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - dev

volumes:
  postgres_data:
